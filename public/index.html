<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>🍌 Raven Alpha</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#0B0E14; --panel:#131722; --line:#232838; --txt:#E8EAED; --dim:#8B92A8; --amb:#F5C843; --pos:#00D4AA; --neg:#FF5A5A; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; }
  input, select { width: 100%; background: #0F1320; border: 1px solid var(--line); color: var(--txt); padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 8px; }
  button { background: var(--amb); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
  button.danger { background: var(--neg); color: #fff; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 8px; }
  .row:last-child { border-bottom: none; }
  .tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--dim); white-space: nowrap; }
  .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
  .status-item { background: #0F1320; border-radius: 8px; padding: 10px; }
  .status-item .k { color: var(--dim); font-size: 10px; }
  .status-item .v { font-weight: 700; margin-top: 2px; }
  .minters { font-size: 11px; color: var(--amb); margin-top: 4px; }
  .empty { color: var(--dim); font-size: 12px; padding: 12px 0; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn { flex: 1; background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .tab-btn.active { background: var(--amb); color: #000; border-color: var(--amb); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .wallet-toggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 10px 0; user-select: none; }
  .wallet-toggle .count { color: var(--amb); font-weight: 700; }
  .wallet-toggle .arrow { transition: transform 0.2s; color: var(--dim); }
  .wallet-toggle.open .arrow { transform: rotate(90deg); }
  #walletList { display: none; max-height: 420px; overflow-y: auto; margin-top: 8px; }
  #walletList.open { display: block; }
  .chain-filter { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .chain-filter button { background: #0F1320; color: var(--dim); border: 1px solid var(--line); padding: 6px 10px; font-size: 11px; font-weight: 600; }
  .chain-filter button.active { background: var(--amb); color: #000; border-color: var(--amb); }

  .alert-links { font-size: 11px; margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .alert-links a { color: var(--amb); text-decoration: none; font-weight: 600; }
  .alert-links a:hover { text-decoration: underline; }
  .alert-head-tags { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🍌 Raven Alpha</h1>
  <div class="sub">Wallet-only alerts — new token buys & NFT mints on your tracked wallets, 24/7 via AWS.</div>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnAlerts" onclick="showTab('alerts')">🔔 Alerts</button>
    <button class="tab-btn" id="tabBtnWallets" onclick="showTab('wallets')">👛 Wallets</button>
  </div>

  <div class="tab-content active" id="tabAlerts">
    <div class="panel">
      <h2>📊 Status</h2>
      <div class="status-grid" id="statusGrid"></div>
    </div>

    <div class="panel">
      <h2>🔔 Alert Log</h2>
      <div id="alertList"></div>
    </div>
  </div>

  <div class="tab-content" id="tabWallets">
    <div class="panel">
      <h2>➕ Add Wallet</h2>
      <div class="form-grid">
        <input id="addr" placeholder="0x wallet address" />
        <select id="chain"></select>
      </div>
      <input id="label" placeholder="Label (optional)" />
      <div class="form-grid">
        <button onclick="addWallet()">+ Add Wallet</button>
        <input id="secret" placeholder="Dashboard secret (if set)" type="password" />
      </div>
    </div>

    <div class="panel">
      <div class="wallet-toggle" id="walletToggle" onclick="toggleWalletList()">
        <h2 style="margin:0;">👛 Tracked Wallets — <span class="count" id="walletCount">0</span></h2>
        <span class="arrow">▶</span>
      </div>
      <div id="walletList">
        <div class="chain-filter" id="chainFilter"></div>
        <div id="walletRows"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const secretHeader = () => ({ "x-dashboard-secret": $("secret").value || "" });
let allWallets = [];
let activeChainFilter = "all";

function showTab(tab) {
  $("tabAlerts").classList.toggle("active", tab === "alerts");
  $("tabWallets").classList.toggle("active", tab === "wallets");
  $("tabBtnAlerts").classList.toggle("active", tab === "alerts");
  $("tabBtnWallets").classList.toggle("active", tab === "wallets");
}

function toggleWalletList() {
  $("walletList").classList.toggle("open");
  $("walletToggle").classList.toggle("open");
}

async function loadChains() {
  const chains = await fetch("/api/chains").then(r => r.json());
  $("chain").innerHTML = chains.map(c =>
    `<option value="${c.id}" ${c.comingSoon ? "disabled" : ""}>${c.name}${c.comingSoon ? " (coming soon)" : ""}</option>`
  ).join("");
  $("chainFilter").innerHTML = `<button class="active" onclick="setChainFilter('all', this)">All</button>` +
    chains.map(c => `<button onclick="setChainFilter('${c.id}', this)">${c.name}</button>`).join("");
}

function setChainFilter(chainId, btn) {
  activeChainFilter = chainId;
  document.querySelectorAll("#chainFilter button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderWallets();
}

async function loadStatus() {
  const s = await fetch("/api/status").then(r => r.json());
  $("statusGrid").innerHTML = `
    <div class="status-item"><div class="k">Wallets tracked</div><div class="v">${s.walletsCount}</div></div>
    <div class="status-item"><div class="k">Last scan</div><div class="v">${s.lastScan ? new Date(s.lastScan.at).toLocaleTimeString() : "—"}</div></div>
    <div class="status-item"><div class="k">Telegram</div><div class="v">${s.telegramConfigured ? "✅ configured" : "⚠️ not set"}</div></div>
    <div class="status-item"><div class="k">Discord</div><div class="v">${s.discordConfigured ? "✅ configured" : "⚠️ not set"}</div></div>
  `;
}

function renderWallets() {
  const filtered = activeChainFilter === "all" ? allWallets : allWallets.filter(w => w.chain === activeChainFilter);
  $("walletCount").textContent = allWallets.length;
  $("walletRows").innerHTML = filtered.length ? filtered.map(w => `
    <div class="row">
      <div>
        <div style="font-weight:600;font-size:13px;">${w.label}</div>
        <div style="font-size:10px;color:var(--dim);">${w.address}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="tag">${w.chain}</span>
        <button class="danger" onclick="removeWallet('${w.id}')">✕</button>
      </div>
    </div>
  `).join("") : `<div class="empty">Is chain pe koi wallet nahi.</div>`;
}

async function loadWallets() {
  allWallets = await fetch("/api/wallets").then(r => r.json());
  renderWallets();
}

async function loadAlerts() {
  const alerts = await fetch("/api/alerts").then(r => r.json());
  $("alertList").innerHTML = alerts.length ? alerts.slice(0, 30).map(a => {
    const isNft = a.type === "wallet_nft_mint";
    const verb = isNft ? "minted" : "bought";
    const title = isNft ? `🟣 ${a.nftName || "NFT Mint"}` : `🔥 ${a.tokenName || "New Token"}${a.sym ? " · $" + a.sym : ""}`;
    const typeLabel = a.itemTypeLabel || (isNft ? "NFT Mint" : "Token");

    const minterList = a.minters || [];
    const minterCount = minterList.length;
    // Other tracked wallets (besides the one that triggered this alert) that
    // also bought/minted this same contract — the cross-wallet reference.
    const othersCount = minterList.filter(m => m.walletId !== a.walletId).length;
    const walletLine = othersCount
      ? `${a.walletLabel} <span style="color:var(--amb);">(+ ${othersCount} other tracked wallet${othersCount > 1 ? "s" : ""})</span>`
      : a.walletLabel;

    const breakdown = minterCount
      ? `<div class="minters">👥 Tracked wallets that ${verb} this: ${minterList.map(m => `${m.label}${m.count > 1 ? ` (x${m.count})` : ""}`).join(", ")}</div>`
      : "";
    const totalLine = (a.totalMints && a.totalMints > minterCount)
      ? `<div class="minters">🧮 Total ${isNft ? "items minted" : "buys"} by tracked wallets: ${a.totalMints}</div>`
      : "";
    const supplyLine = (isNft && a.collectionSupply != null)
      ? `<div class="minters">📦 Collection-wide minted so far: ${a.collectionSupply}</div>`
      : "";

    const l = a.links || {};
    const linkParts = [];
    if (l.tx) linkParts.push(`<a href="${l.tx}" target="_blank" rel="noopener">${isNft ? "Explorer" : "Tx"}</a>`);
    if (l.token) linkParts.push(`<a href="${l.token}" target="_blank" rel="noopener">${isNft ? "Collection Page" : "Token Page"}</a>`);
    if (l.opensea) linkParts.push(`<a href="${l.opensea}" target="_blank" rel="noopener">OpenSea</a>`);
    if (l.marketplace) linkParts.push(`<a href="${l.marketplace}" target="_blank" rel="noopener">Marketplace</a>`);
    const linksRow = linkParts.length ? `<div class="alert-links">${linkParts.join("")}</div>` : "";

    return `
      <div class="row" style="flex-direction:column;align-items:flex-start;">
        <div style="display:flex;justify-content:space-between;width:100%;">
          <div style="font-weight:600;font-size:13px;">${title}</div>
          <div class="alert-head-tags">
            <span class="tag">${typeLabel}</span>
            <span class="tag">${a.chain?.toUpperCase() || ""}</span>
          </div>
        </div>
        <div style="font-size:10px;color:var(--dim);">${walletLine} · ${new Date(a.sentAt).toLocaleString()}</div>
        ${supplyLine}
        ${breakdown}
        ${totalLine}
        ${linksRow}
      </div>
    `;
  }).join("") : `<div class="empty">Abhi koi alert nahi gaya.</div>`;
}

async function addWallet() {
  const address = $("addr").value.trim();
  const chain = $("chain").value;
  const label = $("label").value.trim();
  if (!address) return alert("Address daalo");
  const res = await fetch("/api/wallets", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...secretHeader() },
    body: JSON.stringify({ address, chain, label }),
  });
  if (!res.ok) { const j = await res.json(); alert(j.error || "Failed"); return; }
  $("addr").value = ""; $("label").value = "";
  loadWallets();
}

async function removeWallet(id) {
  await fetch(`/api/wallets/${id}`, { method: "DELETE", headers: secretHeader() });
  loadWallets();
}

async function refreshAll() {
  await Promise.all([loadStatus(), loadWallets(), loadAlerts()]);
}

loadChains();
refreshAll();
setInterval(refreshAll, 15000);
</script>
</body>
</html>
